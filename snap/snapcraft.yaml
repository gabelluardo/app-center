name: snap-store
summary: App Center
description: App Center
confinement: strict
base: core24
grade: stable
version: git

parts:
  flutter-git:
    plugin: nil
    source: .
    override-pull: |
      craftctl default
    override-build: |
      bash $CRAFT_PART_SRC/scripts/install-fvm.sh
      if [ "$CRAFT_ARCH_BUILD_FOR" = riscv64 ]; then
        fvm install --no-setup --skip-pub-get

        # Temporary workaround: Flutter does not publish dart-sdk-linux-riscv64.zip. See https://github.com/flutter/flutter/issues/184306
        # Flutter 3.44.2 uses Dart 3.12.2, which is available from dart-archive.
        flutter_root="$HOME/fvm/versions/3.44.2"
        engine_version="77e2e94772b6eb43759e34ed1ad7da4674e19cab"
        mkdir -p "$flutter_root/bin/cache"
        curl --fail --location --output "$flutter_root/bin/cache/dart-sdk-linux-riscv64.zip" \
          https://storage.googleapis.com/dart-archive/channels/stable/release/3.12.2/sdk/dartsdk-linux-riscv64-release.zip
        unzip -q "$flutter_root/bin/cache/dart-sdk-linux-riscv64.zip" -d "$flutter_root/bin/cache"
        rm "$flutter_root/bin/cache/dart-sdk-linux-riscv64.zip"
        printf '%s\n' "$engine_version" > "$flutter_root/bin/cache/engine.stamp"
        printf '%s\n' "$engine_version" > "$flutter_root/bin/cache/engine-dart-sdk.stamp"
      else
        fvm install
      fi
      fvm flutter doctor
    build-packages:
      - clang
      - cmake
      - curl
      - git
      - libgtk-3-dev
      - ninja-build
      - unzip
      - xz-utils
      - zip
    override-prime: ""

  snap-store:
    after: [flutter-git]
    source: .
    plugin: nil
    override-build: |
      set -eux
      fvm install
      fvm dart pub global activate melos

      set +e # ignore pub errors
      # when building locally artifacts can pollute the container and cause builds to fail
      # this helps increase reliability for local builds
      fvm dart pub global run melos clean
      fvm dart pub global run melos bootstrap
      set -e

      fvm dart pub global run melos exec -c 1 --fail-fast --depends-on=build_runner --order-dependents -- \
      fvm dart run build_runner build --delete-conflicting-outputs

      cd packages/app_center
      fvm flutter gen-l10n
      fvm flutter build linux --release -v
      mkdir -p $CRAFT_PART_INSTALL/bin/
      cp -r build/linux/*/release/bundle/* $CRAFT_PART_INSTALL/bin/

  packagekit-session-installer:
    source: ./packagekit-session-installer
    plugin: meson
    meson-parameters:
      - --prefix=/

apps:
  snap-store:
    command: bin/snap-store
    environment: &store_env
      RATINGS_SERVICE_URL: "ratings.ubuntu.com"
      RATINGS_SERVICE_PORT: "443"
      RATINGS_SERVICE_USE_TLS: "true"
      # temporary fix for https://github.com/canonical/snapcraft-desktop-integration/pull/35
      GIO_LAUNCH_DESKTOP: "$SNAP_DESKTOP_RUNTIME/usr/libexec/gio-launch-desktop"
    desktop: bin/data/flutter_assets/assets/app-center.desktop
    extensions: [gnome]
    plugs: &store_plugs
      - appstream-metadata
      - desktop
      - desktop-launch
      - network
      - snapd-control
      - packagekit-control

  # This entry, along with the corresponding .desktop file, is required
  # to allow Snapd Desktop Integration to open the Snap Center in the
  # "updates" page when the user clicks "Show updates" in a notification.
  # DO NOT DELETE.
  show-updates:
    command: bin/snap-store --updates
    desktop: bin/data/flutter_assets/assets/app-center-updates.desktop
    environment: *store_env
    extensions: [gnome]
    plugs: *store_plugs

  packagekit-session-installer:
    command: bin/packagekit-session-installer
    desktop: bin/data/flutter_assets/assets/app-center-packagekit.desktop
    daemon: dbus
    daemon-scope: user
    activates-on: [packagekit-session]
    environment: *store_env
    extensions: [gnome]
    plugs: *store_plugs

slots:
  packagekit-session:
    interface: dbus
    bus: session
    name: org.freedesktop.PackageKit
  dbus-name:
    interface: dbus
    bus: session
    name: io.snapcraft.Store
